
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RALLY FOOTBALL</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:#06121a;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}
.game{
  position:relative;
  width:100%;
  height:100dvh;
  overflow:hidden;
  background:
    linear-gradient(180deg,rgba(1,8,16,.3),transparent 40%,#04120c 100%),
    radial-gradient(ellipse at 50% 32%,#487a8a 0%,#183642 38%,#08151e 75%);
}
.lights{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 12% 17%,#fffbdc 0 2px,transparent 5px),
    radial-gradient(ellipse at 23% 18%,#d8f5ff 0 2px,transparent 5px),
    radial-gradient(ellipse at 77% 17%,#fffbdc 0 2px,transparent 5px),
    radial-gradient(ellipse at 89% 18%,#d8f5ff 0 2px,transparent 5px),
    linear-gradient(180deg,transparent 24%,#b2d9df18 25%,transparent 48%);
  filter:drop-shadow(0 0 12px #a4e9ff);
}
.pitch{
  position:absolute;left:-30%;right:-30%;bottom:-25%;
  height:59%;
  transform:perspective(300px) rotateX(35deg);
  transform-origin:top;
  background:repeating-linear-gradient(
    90deg,#123c27 0 13%,#1a5030 13% 26%
  );
  border-top:3px solid #b9d4b5;
}
.pitch:before{
  content:"";position:absolute;inset:10% 20%;
  border:2px solid #c5dfbd99;border-radius:50%;
}
.pitch:after{
  content:"";position:absolute;left:0;right:0;top:50%;
  border-top:2px solid #c5dfbd99;
}
.top{
  position:absolute;top:24px;left:22px;right:22px;
  display:flex;align-items:center;justify-content:space-between;
}
.logo{font-weight:1000;font-size:24px;font-style:italic;letter-spacing:2px}
.logo span{color:#38aaff}
.edition{
  font-size:10px;letter-spacing:3px;color:#c9d8e2;
  border:1px solid #ffffff40;padding:8px 10px;
  background:#07111a66;
}
.headline{
  position:absolute;top:15%;left:0;width:100%;
  text-align:center;text-shadow:0 4px 20px #000;
}
.headline small{letter-spacing:7px;color:#d2e5ef;font-size:10px}
h1{
  font-size:clamp(40px,11vw,76px);
  line-height:.91;margin:13px 0;
  font-weight:1000;font-style:italic;letter-spacing:-3px;
}
h1 span{
  display:block;color:#e9bd62;
  -webkit-text-stroke:1px #fff0bf;
  text-shadow:0 0 30px #e9a63766;
}
.tag{font-size:10px;letter-spacing:4px;color:#e5e8e8}
.hero{
  position:absolute;top:32%;left:0;width:100%;height:36%;
  display:flex;justify-content:center;align-items:flex-end;
  pointer-events:none;
}
.player{
  position:absolute;bottom:0;
  width:47%;height:95%;
  border-radius:48% 48% 10% 10%;
  filter:drop-shadow(0 12px 18px #0009);
}
.player:before{
  content:"";position:absolute;left:31%;top:0;
  width:38%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f1c4a0,#9b6043 76%,#543629);
  box-shadow:0 -8px 0 #231d19;
}
.player:after{
  content:"";position:absolute;top:29%;left:3%;width:94%;height:72%;
  clip-path:polygon(28% 0,72% 0,100% 25%,82% 100%,18% 100%,0 25%);
  background:linear-gradient(110deg,#d6dce0,#647b90 46%,#152c47);
}
.player.left{left:4%;transform:rotate(-8deg) scale(.85);opacity:.9}
.player.left:after{background:linear-gradient(110deg,#f6f5ed,#d61c35 48%,#760c23)}
.player.right{right:4%;transform:rotate(8deg) scale(.85);opacity:.9}
.player.right:after{background:linear-gradient(110deg,#18213b,#0870bd 50%,#15213b)}
.player.center{z-index:2;width:48%;height:100%}
.player.center:before{
  background:radial-gradient(circle at 35% 30%,#edc19d,#b77951 75%,#6a3d2b);
}
.player.center:after{
  background:linear-gradient(100deg,#fff 0%,#dedfe4 35%,#1765bd 36%,#d9e9ff 70%,#164b91);
}
.player:after{box-shadow:inset 0 0 25px #0005}
.menu{
  position:absolute;bottom:7%;left:0;right:0;
  display:flex;align-items:center;flex-direction:column;gap:13px;
}
.play{
  width:min(76%,330px);height:62px;
  border:1px solid #fff0ac;
  background:linear-gradient(180deg,#fff0a7 0%,#e9bd55 30%,#a96c19 100%);
  color:#211606;font-size:19px;font-weight:1000;
  font-style:italic;letter-spacing:4px;
  clip-path:polygon(7% 0,93% 0,100% 50%,93% 100%,7% 100%,0 50%);
  filter:drop-shadow(0 0 15px #e5ae4380);
  cursor:pointer;
}
.play:active{transform:scale(.96)}
.sub{font-size:9px;letter-spacing:3px;color:#c7d2d8}
.footer{
  position:absolute;bottom:17px;left:0;right:0;
  text-align:center;font-size:9px;color:#91a4ae;
  letter-spacing:2px;
}
.overlay{
  position:absolute;inset:0;background:#030910f2;
  z-index:10;display:none;align-items:center;
  justify-content:center;text-align:center;padding:25px;
}
.overlay.show{display:flex}
.panel{max-width:360px}
.panel h2{font-size:32px;font-style:italic}
.panel p{color:#b9c6ce;line-height:1.6;font-size:14px}
.back{
  background:transparent;border:1px solid #e9bd62;
  color:#e9bd62;padding:14px 25px;font-weight:bold;
}
@media(min-width:650px){
 .hero{height:43%;top:27%}
 .player{max-width:300px}
 .player.center{max-width:340px}
 .headline{top:12%}
 .menu{bottom:5%}
}
</style>
</head>

<body>
<main class="game">
  <div class="lights"></div>
  <div class="pitch"></div>

  <header class="top">
    <div class="logo"><span>R</span>ALLY</div>
    <div class="edition">FOOTBALL • 2027</div>
  </header>

  <section class="headline">
    <small>THE WORLD IS YOUR STADIUM</small>
    <h1>RALLY <span>FOOTBALL</span></h1>
    <div class="tag">BUILD YOUR LEGACY</div>
  </section>

  <section class="hero" aria-label="Stylized football players">
    <div class="player left"></div>
    <div class="player right"></div>
    <div class="player center"></div>
  </section>

  <section class="menu">
    <button class="play" onclick="startGame()">▶ PLAY</button>
    <div class="sub">YOUR CLUB. YOUR GLORY.</div>
  </section>

  <footer class="footer">RALLY STUDIOS · MOBILE FOOTBALL</footer>

  <section class="overlay" id="next">
    <div class="panel">
      <div class="logo"><span>R</span>ALLY</div>
      <h2>YOUR CAREER STARTS NOW</h2>
      <p>This is the first playable menu prototype. The next stage is building the team-selection screen and actual football gameplay.</p>
      <button class="back" onclick="goBack()">← BACK TO MENU</button>
    </div>
  </section>
</main>

<script>
function startGame(){
  document.getElementById("next").classList.add("show");
}
function goBack(){
  document.getElementById("next").classList.remove("show");
}
</script>
</body>
 </html>
